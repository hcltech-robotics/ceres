[package]
name = "ceres-lerobot-exporter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browser-only LeRobot v3 exporter for the Ceres monitor worker"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-array = "=59.2.0"
arrow-buffer = "=59.2.0"
arrow-schema = "=59.2.0"
parquet = { version = "=59.2.0", default-features = false, features = ["arrow", "snap"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
wasm-bindgen = "=0.2.127"

[dev-dependencies]
bytes = "=1.12.1"
criterion = "=0.5.1"

[[bench]]
name = "exporter"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
