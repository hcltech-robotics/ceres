name: Bridge receiver

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "receiver/**"
      - "protocol/bridge/**"
      - ".github/workflows/bridge-receiver.yml"
  push:
    branches: [main]
    paths:
      - "receiver/**"
      - "protocol/bridge/**"
      - ".github/workflows/bridge-receiver.yml"

permissions:
  contents: read

concurrency:
  group: bridge-receiver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receiver:
    name: Receiver on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
        working-directory: receiver
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ubuntu media runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gst-1.0 \
            gir1.2-gst-plugins-bad-1.0 gir1.2-nice-0.1 gstreamer1.0-tools \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-nice gstreamer1.0-libav
          /usr/bin/python3 -m venv --system-site-packages .venv

      - name: Set up macOS Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Create macOS receiver environment
        if: runner.os == 'macOS'
        run: python -m venv .venv

      - name: Build and install receiver wheel
        run: |
          .venv/bin/python -m pip install 'build>=1,<2'
          .venv/bin/python -m build --wheel
          for wheel in dist/*.whl; do
            .venv/bin/python -m pip install "${wheel}[worker,foxglove,test]"
          done

      - name: Check native media runtime
        run: .venv/bin/ceres-bridge doctor

      - name: Test installed receiver
        run: .venv/bin/python -m pytest -o pythonpath= tests -ra

      - name: Save receiver wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ceres-bridge-${{ matrix.os }}
          path: receiver/dist/*.whl
          if-no-files-found: error
