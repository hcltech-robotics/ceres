name: Native exporter

on:
  pull_request:
    paths:
      - 'native/lerobot-exporter/**'
      - 'wasm/lerobot-exporter/**'
      - '.github/workflows/native-exporter.yml'
  push:
    branches: [main]
    paths:
      - 'native/lerobot-exporter/**'
      - 'wasm/lerobot-exporter/**'
      - '.github/workflows/native-exporter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native tests on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --component clippy,rustfmt
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Check formatting and lint
        run: |
          cargo +1.91.0 fmt --manifest-path native/lerobot-exporter/Cargo.toml --check
          cargo +1.91.0 clippy --locked --all-targets --manifest-path native/lerobot-exporter/Cargo.toml -- -D warnings
      - name: Test native export
        env:
          CERES_EXPORT_ORACLE_DIR: ${{ runner.temp }}/ceres-native-oracle
        run: cargo +1.91.0 test --locked --manifest-path native/lerobot-exporter/Cargo.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Verify official LeRobot compatibility
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'torch==2.11.0' 'torchvision==0.26.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'lerobot[dataset]==0.6.1'
          python native/lerobot-exporter/tests/verify_lerobot.py '${{ runner.temp }}/ceres-native-oracle/dataset'
