name: Native viewer macOS foundations

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-viewer]
  pull_request:
    paths:
      - native/**
      - .github/workflows/native-viewer-macos.yml

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      DEVELOPER_DIR: /Applications/Xcode_26.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          python -m pip install cmake==3.31.6 ninja==1.11.1.4
          # Xcode 26 downloads the Metal compiler separately on some images.
          xcodebuild -downloadComponent MetalToolchain
      - name: Compile portable core, macOS services and GPU probes
        run: |
          cmake -S native/viewer -B build-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCERES_BUILD_APP=OFF \
            -DCERES_BUILD_APP_SERVICES=ON -DCERES_BUILD_BACKEND_PROBES=ON
          cmake --build build-native --parallel 3
      - name: Run CPU and service tests
        run: |
          ctest --test-dir build-native --output-on-failure -LE 'gpu|display'
          python -m unittest discover -s native/viewer/tests -p test_video_configuration.py
      - name: Preserve probes for physical Mac qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ceres-macos-foundation-probes-${{ github.sha }}
          path: |
            build-native/test_videotoolbox
            build-native/test_metal_reduction
            build-native/ceres-probes.metallib
            native/viewer/tests/fixtures/nvdec/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ceres-macos-foundation-logs-${{ github.sha }}
          path: build-native/Testing/Temporary/
          retention-days: 14
